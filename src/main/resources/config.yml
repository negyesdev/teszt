# =====================================================================
#  GeNe Shop - EGYEDI DINAMIKUS ARAZAS  (keszitette: negyes Gerii06)
# ---------------------------------------------------------------------
#  Ez a plugin kulonleges resze. Amikor a szerveren valaki ELAD egy
#  itembol, annak az eladasi ara picit beesik. Az ar magatol, folyamatosan
#  visszamaszik az alapra - a legaljarol kb. recover-minutes perc alatt
#  (alapbol 150 perc = 2.5 ora), tehat ~2-3 oran belul minden visszaall.
#  A VETELI ar fix, ezert nem lehet visszaelni a rendszerrel.
#  A %sell% ar a GUI-ban mar a dinamikus (aktualis) arat mutatja.
# =====================================================================
dynamic-pricing:
  enabled: true
  # Egy eladott darab ennyivel csokkenti az ar-szorzot (0.0 - 1.0).
  drop-per-sale: 0.0008
  # Az ar-szorzo soha nem eshet ez ala (0.40 => max -60%).
  min-multiplier: 0.40
  # Ennyi perc alatt all vissza teljesen az ar a legaljarol az alapra.
  recover-minutes: 150
  # Ilyen gyakran (mp) mentodik el az arak allapota lemezre.
  save-interval-seconds: 120
  # Mutassa-e a GUI-ban kulon sorban, ha egy item ara epp beesett.
  show-discount-note: true
