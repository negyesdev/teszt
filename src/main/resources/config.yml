# =====================================================================
#  GeNe Shop  -  keszitette: negyes Gerii06
#  Dinamikus arazasu shop plugin Minecraft 1.21.8-hoz
# =====================================================================
#
#  Hogyan mukodik a dinamikus arazas?
#   - Minden itemnek van egy alap eladasi ara (sell) es vetel ara (buy).
#   - Amikor a szerveren valaki elad egy itembol, annak az eladasi ara
#     kicsit beesik (lasd: dynamic-pricing.drop-per-sale).
#   - Az ar magatol, folyamatosan visszamaszik az alapertekre. A teljes
#     visszaallas a legaljarol kb. recover-minutes perc (alapbol 150 perc
#     = 2.5 ora), tehat ~2-3 oran belul minden ar normalisra all vissza.
#   - A VETELI ar fix, ezert nem lehet "buy-low / sell-high" trukkel
#     visszaelni a rendszerrel.
#
# =====================================================================

settings:
  # A GUI fomenu cime.
  main-title: "&8» &b&lGeNe Shop"
  # A penznem szimboluma a kiirasokban (csak megjelenites).
  currency-symbol: "$"
  # Hangok lejatszasa a tranzakciokhoz.
  sounds: true
  # Ennyi tizedesjegyre kerekitsuk az arakat a kiirasban.
  price-decimals: 2

dynamic-pricing:
  # Bekapcsolja a dinamikus arazast. Ha false, az eladasi ar mindig fix.
  enabled: true
  # Egyetlen eladott darab ennyivel csokkenti az ar-szorzot (0.0 - 1.0).
  # Pl. 0.0008 azt jelenti: 1 stack (64 db) eladasa ~5%-kal csokkenti az arat.
  drop-per-sale: 0.0008
  # Az ar-szorzo soha nem eshet ez ala (vagyis legfeljebb ennyire esik be az ar).
  # 0.40 => az eladasi ar maximum 60%-ot eshet.
  min-multiplier: 0.40
  # Ennyi perc alatt all vissza teljesen az ar a legaljarol az alapertekre.
  # 150 perc = 2.5 ora (a "2-3 oran belul" kovetelmenynek megfelelo).
  recover-minutes: 150
  # Ilyen gyakran (masodperc) mentodik el az arak allapota lemezre.
  save-interval-seconds: 120

# =====================================================================
#  KATEGORIAK
#  Minden kategoria sajat ablakot kap. Az "icon" a fomenuben latszik.
#  Az itemeknel: buy = vetel ar (fix), sell = alap eladasi ar.
#  Ha egy itemnel a buy vagy sell -1, akkor az a muvelet le van tiltva.
# =====================================================================
